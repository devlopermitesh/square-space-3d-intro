<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0c" />
    <meta name="description" content="AHA Design Consultants — Architecture, Interior Design, Redevelopment &amp; Project Consulting. Vardham Industrial, Thane West, Maharashtra - 400601." />
    <title>AHA Design Consultants — Architectural Intro</title>
  </head>
  <body>
    <div id="app" aria-label="AHA Design Consultants architectural intro">
      <canvas id="scene" aria-label="3D architectural construction animation"></canvas>
      <div class="overlay" aria-hidden="true">
        <div class="overlay__vignette"></div>
        <div class="overlay__haze"></div>
      </div>

      <button id="skip" type="button" aria-label="Skip intro">SKIP INTRO</button>

      <div id="titleCard" class="title-card" aria-hidden="true">
        <div class="title-card__inner">
          <div class="title-card__name">AHA DESIGN CONSULTANTS</div>
          <div class="title-card__sub">Architecture · Interior Design · Redevelopment · Project</div>
          <div class="title-card__loc">Vardham Industrial, Thane West, Maharashtra - 400601</div>
        </div>
      </div>

      <div id="fadeOut" class="fade-out" aria-hidden="true"></div>

      <footer class="hud" aria-live="polite">
        <div class="hud__phase" id="status">ESTABLISHING</div>
        <div class="hud__track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="bar"></div>
        </div>
      </footer>

      <div id="fallback" class="fallback" hidden>
        <div class="fallback__inner">
          <div class="fallback__name">AHA DESIGN CONSULTANTS</div>
          <div class="fallback__sub">Architecture · Interior Design · Redevelopment · Project</div>
          <div class="fallback__loc">Vardham Industrial, Thane West, Maharashtra - 400601</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
